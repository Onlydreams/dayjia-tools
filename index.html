<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dayjia Tools - 羽绒服保暖参数评估与实用工具集合</title>
    <meta name="description" content="Dayjia Tools 提供羽绒服保暖参数评估、模型参考温度、A/B 对比、目标温度反推，以及国标蓬松高度与常见 FP 的近似换算工具。">
    <link rel="canonical" href="https://tool.dayjia.com/">
    <style>
      :root {
        color-scheme: dark;
        --bg: #101b28;
        --surface: #172a3e;
        --fg: #f8f5ec;
        --muted: #aebbc6;
        --line: #31485c;
        --accent: #f0be79;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100dvh;
        margin: 0;
        background:
          linear-gradient(90deg, rgba(255, 255, 255, .035) 1px, transparent 1px),
          linear-gradient(0deg, rgba(255, 255, 255, .035) 1px, transparent 1px),
          var(--bg);
        background-size: 28px 28px;
        color: var(--fg);
        font-family: "Avenir Next", "PingFang SC", ui-sans-serif, system-ui, sans-serif;
        line-height: 1.6;
      }

      main {
        width: min(960px, calc(100% - 40px));
        margin: 0 auto;
        padding: clamp(56px, 9vw, 110px) 0;
      }

      .kicker {
        margin-bottom: 12px;
        color: var(--accent);
        font-size: .72rem;
        font-weight: 800;
        letter-spacing: .14em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 760px;
        margin: 0;
        font-family: "Iowan Old Style", "Songti SC", "Noto Serif CJK SC", serif;
        font-size: clamp(3.25rem, 6vw, 5.25rem);
        font-weight: 700;
        letter-spacing: -.045em;
        line-height: 1;
      }

      h1 span {
        white-space: nowrap;
      }

      .lead {
        max-width: 680px;
        margin-top: 24px;
        color: var(--muted);
        font-size: clamp(1rem, 2vw, 1.15rem);
      }

      p {
        margin: 0;
      }

      .tools {
        margin-top: clamp(42px, 6vw, 64px);
      }

      .tool {
        position: relative;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 28px;
        align-items: end;
        min-height: 238px;
        padding: clamp(24px, 5vw, 44px);
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 12px;
        background:
          radial-gradient(circle at 92% 90%, rgba(240, 190, 121, .18), transparent 28%),
          var(--surface);
        color: inherit;
        text-decoration: none;
        transition: border-color .18s, transform .18s;
      }

      .tool::after {
        position: absolute;
        right: 0;
        bottom: 0;
        width: 42%;
        height: 48%;
        background:
          repeating-linear-gradient(90deg, rgba(255,255,255,.07) 0 1px, transparent 1px 24px),
          repeating-linear-gradient(0deg, rgba(255,255,255,.07) 0 1px, transparent 1px 24px);
        content: "";
        mask-image: linear-gradient(to top, #000, transparent);
        pointer-events: none;
      }

      .tool-copy, .tool-cta {
        position: relative;
        z-index: 1;
      }

      .tool-category {
        display: block;
        margin-bottom: 12px;
        color: var(--accent);
        font-size: .72rem;
        font-weight: 800;
        letter-spacing: .1em;
        text-transform: uppercase;
      }

      .tool strong {
        display: block;
        font-family: "Iowan Old Style", "Songti SC", "Noto Serif CJK SC", serif;
        font-size: clamp(1.75rem, 4vw, 2.65rem);
        line-height: 1.05;
      }

      .tool-description {
        display: block;
        max-width: 610px;
        margin-top: 14px;
        color: var(--muted);
        font-size: .95rem;
      }

      .capabilities {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        margin-top: 22px;
      }

      .capabilities span {
        padding: 5px 9px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--muted);
        font-size: .72rem;
      }

      .tool-cta {
        color: var(--accent);
        font-size: .9rem;
        font-weight: 800;
        white-space: nowrap;
      }

      .tool:hover {
        border-color: var(--accent);
        transform: translateY(-2px);
      }

      .tool:focus-visible {
        outline: 3px solid rgba(240, 190, 121, .62);
        outline-offset: 4px;
      }

      @media (max-width: 560px) {
        main { width: min(100% - 28px, 960px); padding-top: 46px; }
        h1 span { display: block; }
        h1 span + span { margin-top: .08em; }
        .tool { grid-template-columns: 1fr; min-height: 0; }
        .tool-cta { justify-self: start; }
      }

      @media (prefers-reduced-motion: reduce) {
        .tool { transition: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="kicker">Independent utilities</p>
      <h1><span>Dayjia</span> <span>Tools</span></h1>
      <p class="lead">独立维护、打开即用的轻量工具。先提供羽绒服选购决策，后续按真实需求逐步增加。</p>

      <section class="tools" aria-label="工具列表">
        <a class="tool" href="/down-jacket-helper/">
          <span class="tool-copy">
            <span class="tool-category">Clothing · Decision tool</span>
            <strong>羽绒服小助手</strong>
            <span class="tool-description">从吊牌参数估算模型参考温度与场景，比较两件候选款，并完成国标蓬松高度与常见 FP 的近似换算。</span>
            <span class="capabilities"><span>单件评估</span><span>A/B 对比</span><span>目标温度反推</span><span>蓬松度近似换算</span></span>
          </span>
          <span class="tool-cta">打开工具 →</span>
        </a>
      </section>
    </main>
  </body>
</html>
